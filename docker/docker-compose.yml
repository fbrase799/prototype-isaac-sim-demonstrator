# Official NGC Isaac Sim 6.0 image, plus this repository's Python experiments.
# On RunPod you are usually already inside this image — use docker/run.sh there,
# which calls /isaac-sim/python.sh directly. Compose is for other GPU hosts.

services:
  isaac-sim:
    image: ${ISAAC_SIM_IMAGE:-nvcr.io/nvidia/isaac-sim:6.0.1}
    stdin_open: true
    tty: true
    ipc: host
    shm_size: "2gb"
    working_dir: /isaac-sim
    entrypoint: ["bash"]
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: ${PRIVACY_CONSENT:-Y}
      ISAAC_DEMO_OUTPUT: /workspace/output
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ..:/workspace:rw
      - ../.cache/isaac-sim/main:/isaac-sim/.cache:rw
      - ../.cache/isaac-sim/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ../.cache/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ../.cache/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ../.cache/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw
      - ../.cache/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
